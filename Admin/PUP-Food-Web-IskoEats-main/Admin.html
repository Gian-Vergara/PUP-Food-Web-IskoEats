<!DOCTYPE html>
<html lang="en">
<head>

    <link rel = "stylesheet" href = "Admin.Css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel= "icon" type = "image/png" href = "Photos/Iskoeatslogo3.png">
    <!-- Title -->
    <title>IskoEats Admin Panel</title>

    <!-- Font Awesome Link-->
    <script src="https://kit.fontawesome.com/895c43d99c.js" crossorigin="anonymous"></script>

</head>


<body>
    
    <!-- Navbar   -->

    <div class = "navbar">
            <i class="fa-solid fa-bars" style="color: rgb(0, 0, 0);"></i>
            <img id = "Pagelogo" src = "Photos/Iskoeatslogo3.png" id = "Logo">
        <span id = "WebsiteName">
            <span class = "navtext" id = "T1">Isko</span> 
            <span class = "navtext" id = "T2">Eats</span>
        </span>
            <span id = "Admintext">AdminPanel</span>
            <img src = "Photos/ICE penguin of madagascar.jpg" id = "Profilepic">
            <span id = "AnotherText">System Admin</span>
    </div>

    <!-- Statistics-->

    <div class = "statscontainer">
        <div id = "Cont1"  class = "Cont">
            <img src = "Photos/Time.png" class = "staticon" >
            <div class = "info">
                <span class = "statnum" id = "s1">0</span>
                <span class = "statsdes" id = "s1">Pending</span>
            </div>
        </div>
        <div id = "Cont2" class = "Cont">
            <img src = "Photos/Graduate Hat.png" class = "staticon" >
            <div class = "info">
                <span class = "statnum" id = "s2">0</span>
                <span class = "statsdes" id = "s2">Approved</span>
            </div>
        </div>
        <div id = "Cont3" class = "Cont">
            <img src = "Photos/Market.png" class = "staticon" >
            <div class = "info">
                <span class = "statnum" id = "s3">0</span>
                <span class = "statsdes" id = "s3">Vendors</span>  
            </div>
        </div>
    </div>

    <!-- Choosing between students and vendor-->
    <div id = "outsideChoice">
        <div id = "Choice">
            <span id = "student" class = "options">Students</span>
            <span id = "vendor" class = "options">Vendors</span>
        </div>
        <button id="openAddBtn">+ Add Student</button>
    </div>
    
    <div id="listArea">
        <div id="studentList" class="list">
        <h2 id="listTitle">Students</h2>

        <table class="student-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Student Number</th>
                </tr>
            </thead>
            <tbody id="studentItem"></tbody>
        </table>
    </div>
    </div>
 
    <div id="modal" class="modal hidden">
    <div class="modal-content">
        <h3>Add Student</h3>
        <form id="addStudentForm">
            <input type="text" id="nameInput" placeholder="Name" required>
            <input type="email" id="emailInput" placeholder="Email" required>
            <input type="text" id="numberInput" placeholder="Student Number" required>

            <div class="modal-buttons">
                <button type="button" id="cancelBtn">Cancel</button>
                <button type="submit" id="saveBtn">Save</button>
            </div>
        </form>
    </div>
</div>
























</body>

</html>
