<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>

        <style>

        body {
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center; 
            align-items: center;     
            height: 100vh;
            margin: 0;
        }
        .login-box {
        background-color: white;
        padding: 75px;
        border-radius: 10px;
        text-align: center;
        }
        .textbox {
        display: block;
        width: 300px;
        margin: 10px auto;
        padding: 10px;
        border-radius: 20px;
        background-color: rgb(232, 226, 226);
        border: none;
        }
        .logo {
            height: auto;
            width: 150px;
            margin: -50px;
        }
        button {
            border-radius: 20px;
            width: 100px;
            padding: 3px;
            background-color: #5edc1f;
        }
        p {
            margin: -5px;
        }
        h1 {
            margin-bottom: 10px;
            font-family: Arial;
        }
        .background {
            position: fixed;
            top: -10px;
            left: 0;
            width: calc(100% + 100px);
            height: calc(100% + 100px);
            background-image: url(OffiBG.png);
            background-size: cover;
            background-position: center;
            transform: scale(1.1);
            z-index: -1;
        }


        </style>



</head>
<body>
<div class="background"></div>
<div class="login-box">
    <img src="CLogo.png" alt="PUP Lagoon" class="logo">
    <h1> Welcome Back!</h1>
    <p> Log in to order from the Lagoon stalls</p>
    <input type="text" placeholder="Email" class="textbox">
    <input type="text" placeholder="Password" class="textbox">
    <button> Log In</button>
</div>
</body>
</html>
