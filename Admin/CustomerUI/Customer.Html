<!DOCTYPE html>
<html lang="en">
<head>

    <link rel = "stylesheet" href = "Customer.Css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel= "icon" type = "image/png" href = "Photos/Iskoeatslogo3.png">
    <!-- Title -->
    <title>Customer</title>

    <!-- Font Awesome Link-->
    <script src="https://kit.fontawesome.com/895c43d99c.js" crossorigin="anonymous"></script>

    <style>Customer.Css</style>
</head>


<body>
    
    <!-- Navbar   -->

    <div class = "navbar">
            <i id="menuBtn" class="fa-solid fa-bars" style="color: rgb(0, 0, 0);"></i>
            <img id = "Pagelogo" src = "CLogo.png" id = "Logo">
        <span id = "WebsiteName">
            <span class = "navtext" id = "T1">Isko</span> 
            <span class = "navtext" id = "T2">Eats</span>
        </span>
    </div>

    <!-- Statistics-->

    <div class = "statscontainer">
        <div id = "Cont1"  class = "Cont">
            <span class="emoji">🔥</span>
            <div class = "info">
                <span class = "statnum" id = "s1">0</span>
                <span class = "statsdes" id = "s1">Active Orders</span>
            </div>
        </div>
        <div id = "Cont2" class = "Cont">
            <span class="emoji"> 🛒</span>
            <div class = "info">
                <span class = "statnum" id = "s2">0</span>
                <span class = "statsdes" id = "s2">In Cart</span>
            </div>
        </div>
        <div id = "Cont3" class = "Cont">
            <span class="emoji"> 📄</span>
            <div class = "info">
                <span class = "statnum" id = "s3">0</span>
                <span class = "statsdes" id = "s3"> Total Order</span>  
            </div>
        </div>
    </div>

    <!-- Choosing between students and vendor-->
    <div id = "outsideChoice">
        <div id = "Choice">
            <span id = "student" class = "options">Map</span>
            <span id = "vendor" class = "options">Menu</span>
            <span id = "vendor" class = "options">Cart</span>
            <span id = "vendor" class = "options">My Orders</span>
        </div>
    </div>






















 <script src="Customer.js"></script>
</body>

</html>
